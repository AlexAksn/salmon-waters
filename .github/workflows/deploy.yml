# Builds and deploys to GitHub Pages on every push to main, and on a schedule so the
# DFO page freshness check and fishery-notice pull (scripts/check-dfo.mjs, scripts/fetch-notices.mjs, run by
# `prebuild`) stay current. ~1 min per run x 8/day is well inside the free Actions quota. No servers involved.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (UTC)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build # prebuild = DFO freshness check + notices -> public/data/{dfo-status,notices}.json
        # Served at the root of the custom domain (public/CNAME), so no BASE_PATH sub-path.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
